# Shaders on by default with Super Duper Vanilla, set up as the pack's maker plays it (its settings are in
# shaderpacks/superDuperVanilla.zip.txt). Players can change this in Options > Video Settings > Shader Packs
# (or press O); updates keep their choice.
enableShaders=true
shaderPack=superDuperVanilla.zip
maxShadowRenderDistance=32
colorSpace=SRGB
